name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            name: shiftool.exe
          - os: ubuntu-latest
            target: linux
            name: shiftool

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller yt-dlp pymupdf docx2pdf rich pyfiglet pillow pandas openpyxl pypdf moviepy

      - name: Build with PyInstaller (Windows)
        if: matrix.target == 'windows'
        run: |
          pyinstaller --onefile --noconsole --name shiftool shiftTool.py

      - name: Build with PyInstaller (Linux)
        if: matrix.target == 'linux'
        run: |
          pyinstaller --onefile --name shiftool shiftTool.py

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}
